name: Build and Release

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go test ./...

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            out: pvm_linux_amd64
          - os: ubuntu-24.04-arm
            out: pvm_linux_arm64
          - os: macos-latest
            out: pvm_darwin_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install qemu (macOS, for the bundled runtime)
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Build ${{ matrix.out }}
        env:
          PVM_VERSION: ${{ github.ref_name }}
          PVM_PACK_QEMU: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          ./script/build.sh
          tar -czf ${{ matrix.out }}.tar.gz pvm
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf pvm-qemu-runtime-aarch64.tar.gz -C "$HOME/.pvm/runtime/qemu" aarch64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}.tar.gz
            pvm-qemu-runtime-aarch64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
      - name: Prepare release files
        run: |
          mkdir -p release
          find . -path ./release -prune -o \( -name "*.tar.gz" \) -type f -print | while read f; do cp "$f" release/; done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
