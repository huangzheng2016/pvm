name: Build and Release

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go test ./...

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: pvm_linux_amd64
          - os: ubuntu-24.04-arm
            out: pvm_linux_arm64
          - os: macos-latest
            out: pvm_darwin_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install qemu (macOS, for the bundled runtime)
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "no signing certificate configured; falling back to ad-hoc"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/pvm-codesign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pvm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build ${{ matrix.out }}
        env:
          PVM_VERSION: ${{ github.ref_name }}
          PVM_PACK_QEMU: ${{ runner.os == 'macOS' && '1' || '0' }}
          PVM_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [ "${{ matrix.out }}" = "pvm_linux_arm64" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X github.com/huangzheng2016/pvm/internal/buildinfo.Version=${PVM_VERSION}" -o pvm ./cmd/pvm
          else
            ./script/build.sh
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign -s "${PVM_CODESIGN_IDENTITY:--}" --force pvm
          fi
          tar -czf ${{ matrix.out }}.tar.gz pvm
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf pvm-qemu-runtime-aarch64.tar.gz -C "$HOME/.pvm/runtime/qemu" aarch64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: |
            ${{ matrix.out }}.tar.gz
            pvm-qemu-runtime-aarch64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
      - name: Prepare release files
        run: |
          mkdir -p release
          find . -path ./release -prune -o \( -name "*.tar.gz" \) -type f -print | while read f; do cp "$f" release/; done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
